<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SimpleMQ Basic Chat Demo</title>
    <link rel="stylesheet" type="text/css" href="style.css"/> 
      <script src="/rtl/smq.js"></script>
      <script>
        addEventListener("DOMContentLoaded",function() {
            var input=document.getElementById("msg");
            var messages=document.querySelector("#messages ul");
            var smq = SMQ.Client(SMQ.wsURL("/smq.lsp"),{info:"I am the basic chat client"});
            function onChatMsg(msg,ftid) {
                var item=document.createElement("li");
                item.textContent=msg;
                messages.append(item);
            };
            function sendChatMsg(e) {
                e.preventDefault();
                smq.publish(input.value,"BasicChatMsg");
                input.value="";
                input.focus();
            };
            smq.subscribe("BasicChatMsg", {onmsg:onChatMsg, datatype:"text"});
            document.querySelector("form").addEventListener("submit",sendChatMsg);
            input.addEventListener("keydown",function(e) {
                if(e.key == "Enter") sendChatMsg(e);
            });
        });
      </script>
  </head>
  <body>
    <table class="BasicChat">
      <tr>
      <td>
        <div id="messages">
          <div><ul></ul></div> <!-- Messages will be injected by JavaScript here -->
          <form>
            <input placeholder="Write your message..." id="msg" autocomplete="off"/>
          </form>
        </div>
        </td>
      </tr>
    </table>
  </body>
</html>
